name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pink Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: DivyanshuJain2006
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF69B4&color_dots=#161020,#3D1630,#7A1F5C,#C72C91,#FF69B4
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF69B4&color_dots=#161020,#3D1630,#7A1F5C,#C72C91,#FF69B4

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
